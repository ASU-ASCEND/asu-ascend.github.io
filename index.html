<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ASU ASCEND STRATODEVILS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f4f4;
      color: #333;
      line-height: 1.6;
    }
    .container {
      width: 90%;
      max-width: 1000px;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      position: relative;
    }
    header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      border-bottom: 2px solid #ddd;
      padding: 10px 0;
      margin-bottom: 20px;
    }
    .header-left,
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 {
      text-align: center;
      font-size: 2em;
      color: #0073e6;
      margin: 0;
    }
    header img {
      height: 60px;
      width: auto;
    }
    p {
      margin-bottom: 20px;
      text-align: center;
    }
    p a {
      color: #0073e6;
      text-decoration: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background: #0073e6;
      color: #fff;
    }
    tr:nth-child(even) {
      background: #f9f9f9;
    }
    tr:hover {
      background: #f1f1f1;
    }
    .semester {
      text-align: left;
      font-weight: bold;
    }
    footer {
      position: relative;
      text-align: center;
      padding: 10px;
      font-size: 0.9em;
      color: #777;
      border-top: 1px solid #ddd;
      margin-top: 20px;
    }
    footer img {
      position: absolute;
      right: 10px;
      bottom: 10px;
      height: 60px;
      width: auto;
    }
    /* Responsive adjustments */
    @media (max-width: 600px) {
      header {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .header-left, .header-right {
        justify-content: center;
      }
      footer img {
        position: static;
        display: block;
        margin: 10px auto 0;
      }
      th, td {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <img src="az space grant logo.jpg" alt="AZ Space Grant Logo">
        <img src="ANSR LOGO.png" alt="ANSR Logo">
      </div>
      <h1>ASU ASCEND STRATODEVILS</h1>
      <div class="header-right">
        <img src="nasa logo.png" alt="NASA Logo">
        <img src="sdsl-logo.png" alt="SDSL Logo">
      </div>
    </header>

    <p>ASU ASCEND website: <a href="https://asuascend.weebly.com/" target="_blank">https://asuascend.weebly.com/</a></p>
    
    <table>
      <thead>
        <tr>
          <th>Semester</th>
          <th>GitHub Repository</th>
          <th>Documentation</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="semester">2025 Spring</td>
          <td><a href="https://github.com/ASU-ASCEND/Spring-2025" target="_blank">GitHub</a></td>
          <td><a href="https://asu-ascend.github.io/Spring-2025/" target="_blank">Documentation</a></td>
        </tr>
        <tr>
          <td class="semester">2024 Fall</td>
          <td><a href="https://github.com/ASU-ASCEND/Fall-2024" target="_blank">GitHub</a></td>
          <td><a href="https://asu-ascend.github.io/Fall-2024/" target="_blank">Documentation</a></td>
        </tr>
        <tr>
          <td class="semester">2024 Spring</td>
          <td><a href="https://github.com/ASU-ASCEND/AcademicYear-2023-24" target="_blank">GitHub</a></td>
          <td></td>
        </tr>
        <tr>
          <td class="semester">2023 Fall</td>
          <td><a href="https://github.com/ASU-ASCEND/AcademicYear-2023-24/tree/main/Fall2023" target="_blank">GitHub</a></td>
          <td></td>
        </tr>
      </tbody>
    </table>
    
    <footer>
      <p>&copy; 2025 ASU ASCEND. All rights reserved.</p>
      <img src="ASU-logo.png" alt="ASU Logo">
    </footer>
  </div>
</body>
</html>
